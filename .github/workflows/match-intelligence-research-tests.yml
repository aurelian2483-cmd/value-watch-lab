name: Match Intelligence Research Tests
on:
  push:
    branches:
      - research/chelsea-arsenal-match-intelligence
    paths:
      - 'scripts/match_intelligence_backtest.cjs'
      - 'scripts/match_intelligence_stage3.cjs'
      - 'tests/test_match_intelligence_backtest.cjs'
      - 'tests/test_match_intelligence_stage3.cjs'
      - 'tests/test_match_intelligence_stage4.cjs'
      - 'tests/test_match_intelligence_stage5.cjs'
      - 'tests/test_match_intelligence_stage6.cjs'
      - 'tests/test_match_intelligence_stage7.cjs'
      - 'tests/test_match_intelligence_stage8.cjs'
      - 'tests/test_match_intelligence_dynamic_player.cjs'
      - 'tests/test_match_intelligence_falsification.cjs'
      - 'tests/test_match_intelligence_fixture_join.cjs'
      - 'tests/test_match_intelligence_lagged_xi.cjs'
      - 'tests/test_match_intelligence_player_relevance.cjs'
      - 'tests/test_match_intelligence_stage10.cjs'
      - 'tests/test_match_intelligence_stage11.cjs'
      - 'tests/test_match_intelligence_stage12.cjs'
      - 'tests/test_match_intelligence_stage13.cjs'
      - 'tests/test_match_intelligence_prospective_lab.cjs'
      - 'research/match-intelligence/**'
      - '.github/workflows/match-intelligence-research-tests.yml'
  workflow_dispatch:
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence audit and historical replay unit tests
        run: node --test tests/test_match_intelligence_evidence.cjs tests/test_match_intelligence_backtest.cjs tests/test_match_intelligence_stage3.cjs tests/test_match_intelligence_stage4.cjs tests/test_match_intelligence_stage5.cjs tests/test_match_intelligence_stage6.cjs tests/test_match_intelligence_stage7.cjs tests/test_match_intelligence_stage8.cjs tests/test_match_intelligence_dynamic_player.cjs tests/test_match_intelligence_falsification.cjs tests/test_match_intelligence_fixture_join.cjs tests/test_match_intelligence_lagged_xi.cjs tests/test_match_intelligence_player_relevance.cjs tests/test_match_intelligence_stage10.cjs tests/test_match_intelligence_stage11.cjs tests/test_match_intelligence_stage12.cjs tests/test_match_intelligence_stage13.cjs tests/test_match_intelligence_prospective_lab.cjs

  stage3-historical-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve pinned public EPL history for diagnostic replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/epl-history
          for season in 2020_21 2021_22 2022_23 2023_24 2024_25 2025_26; do
            curl --fail --location --retry 2 --silent --show-error \
              "https://raw.githubusercontent.com/skthewimp/football/9a0fa04365f4266d95f5cbb119ec6fc64f5e773c/data/raw/epl_results_${season}.csv" \
              --output "/tmp/epl-history/epl_results_${season}.csv"
          done
      - name: Run Stage 3 fixed-specification historical replay (not fresh validation)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/match_intelligence_stage3.cjs \
            /tmp/epl-history/epl_results_2020_21.csv \
            /tmp/epl-history/epl_results_2021_22.csv \
            /tmp/epl-history/epl_results_2022_23.csv \
            /tmp/epl-history/epl_results_2023_24.csv \
            /tmp/epl-history/epl_results_2024_25.csv \
            /tmp/epl-history/epl_results_2025_26.csv | tee stage3-diagnostic-report.json
      - name: Run Stage 12 de-vig bookmaker comparison on already examined seasons
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/stage12-market-calibration.cjs \
            /tmp/epl-history/epl_results_2024_25.csv \
            /tmp/epl-history/epl_results_2025_26.csv | tee stage12-market-calibration.json
      - name: Run Stage 13 market blend research (reused outcomes only)
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/stage13-market-blend.cjs \
            /tmp/epl-history/epl_results_2023_24.csv \
            /tmp/epl-history/epl_results_2024_25.csv \
            /tmp/epl-history/epl_results_2025_26.csv | tee stage13-market-blend.json
      - name: Display genuine result vs reconstructed old/new predictions match by match
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/fixture-by-fixture-comparison.cjs \
            /tmp/epl-history/epl_results_2024_25.csv \
            /tmp/epl-history/epl_results_2025_26.csv | tee fixture-by-fixture-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-by-fixture-comparison
          path: fixture-by-fixture-comparison.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage13-market-blend-diagnostic
          path: stage13-market-blend.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-market-calibration
          path: stage12-market-calibration.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-diagnostic-report
          path: stage3-diagnostic-report.json
          retention-days: 30

  stage7-historical-lineup-import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve pinned retrospective Chelsea and Arsenal season files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage7-retrospective
          for club in fc-chelsea fc-arsenal; do
            curl --fail --location --retry 2 --silent --show-error \
              "https://raw.githubusercontent.com/withqwerty/availability-data/5c6286c24dd58b3c9a6b4f5ccbd0c6e6466cb7dd/raw/GB1/2024/${club}.json" \
              --output "/tmp/stage7-retrospective/${club}.json"
          done
      - name: Audit retrospective real-file XI counts (not prematch validation)
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {normalizeHistoricalAvailability}=require('./research/match-intelligence/historical-availability.js');
          for(const name of ['fc-chelsea','fc-arsenal']){
            const data=JSON.parse(fs.readFileSync('/tmp/stage7-retrospective/'+name+'.json','utf8'));
            const result=normalizeHistoricalAvailability(data);
            assert.equal(result.rounds.length,38);
            assert.equal(result.rounds.filter(r=>r.starters===11).length,38);
            assert.equal(result.errors.length,0);
            assert.equal(result.eligible_for_prematch_prediction,false);
            assert.equal(result.eligible_for_historical_training,false);
            console.log(JSON.stringify({club:result.club,season:result.season,players:result.player_count,
              rounds:result.rounds.length,full_starting_XI_rounds:result.rounds.filter(r=>r.starters===11).length,
              retrospective_only:result.retrospective_data_only,trained:false}));
          }
          NODE

  stage8c-synthetic-falsification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and evaluate controlled signed, zero, and inverted effects
        run: node research/match-intelligence/player-impact-falsification.js | tee stage8c-simulation-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: stage8c-controlled-simulation
          path: stage8c-simulation-results.jsonl
          retention-days: 90

  stage8d-real-fixture-join:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve pinned open fixture matchdays and retrospective lineups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage8d
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/openfootball/football.json/e6744429ee395bc86f247348c6184bb08d4eb361/2024-25/en.1.json" -o /tmp/stage8d/en.1.json
          for club in fc-chelsea fc-arsenal; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/withqwerty/availability-data/5c6286c24dd58b3c9a6b4f5ccbd0c6e6466cb7dd/raw/GB1/2024/${club}.json" -o "/tmp/stage8d/${club}.json"
          done
      - name: Perform actual Chelsea Arsenal fixture-linked round audits
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' | tee stage8d-fixture-join.jsonl
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {auditClubFixtureJoin}=require('./research/match-intelligence/fixture-lineup-join');
          const results=JSON.parse(fs.readFileSync('/tmp/stage8d/en.1.json','utf8'));
          for(const club of ['fc-chelsea','fc-arsenal']){
            const archive=JSON.parse(fs.readFileSync('/tmp/stage8d/'+club+'.json','utf8'));
            const a=auditClubFixtureJoin({archive,results});
            const report={club:a.club,joined:a.joined,issue_count:a.issues.length,
              issues:a.issues.slice(0,12),valid_38_rounds:a.valid_38_rounds,
              prematch_predicted_player_impact:false,training_executed:false,
              lagged_continuity_observations:a.rows.filter(x=>x.prematchFeatures&&x.prematchFeatures.prior_match_previous_XI_retention!==null).length};
            console.log(JSON.stringify(report));
            assert.equal(a.joined,38);
            assert.equal(a.issues.length,0);
            assert.equal(a.valid_38_rounds,true);
            assert.equal(a.prediction_eligible,false);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8d-joined-lineup-audit
          path: stage8d-fixture-join.jsonl
          retention-days: 90

  stage8e-real-lagged-xi-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve frozen fixtures and all 40 retrospective team-season files
        shell: bash
        run: |
          set -euo pipefail
          for season in 2023-24 2024-25; do
            mkdir -p "/tmp/stage8e/$season/clubs"
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/openfootball/football.json/e6744429ee395bc86f247348c6184bb08d4eb361/$season/en.1.json" -o "/tmp/stage8e/$season/en.1.json"
          done
          for slug in afc-bournemouth aston-villa brighton-amp-hove-albion crystal-palace fc-arsenal fc-brentford fc-burnley fc-chelsea fc-everton fc-fulham fc-liverpool luton-town manchester-city manchester-united newcastle-united nottingham-forest sheffield-united tottenham-hotspur west-ham-united wolverhampton-wanderers; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/withqwerty/availability-data/5c6286c24dd58b3c9a6b4f5ccbd0c6e6466cb7dd/raw/GB1/2023/${slug}.json" -o "/tmp/stage8e/2023-24/clubs/${slug}.json"
          done
          for slug in afc-bournemouth aston-villa brighton-amp-hove-albion crystal-palace fc-arsenal fc-brentford fc-chelsea fc-everton fc-fulham fc-liverpool fc-southampton ipswich-town leicester-city manchester-city manchester-united newcastle-united nottingham-forest tottenham-hotspur west-ham-united wolverhampton-wanderers; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/withqwerty/availability-data/5c6286c24dd58b3c9a6b4f5ccbd0c6e6466cb7dd/raw/GB1/2024/${slug}.json" -o "/tmp/stage8e/2024-25/clubs/${slug}.json"
          done
      - name: Run calibration and reused-season diagnostic (NOT fresh validation)
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/lagged-xi-diagnostic.js /tmp/stage8e | tee stage8e-lagged-xi-results.json
      - name: Run Stage 10 real outcome prior-only player residual diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/stage10-player-residuals.cjs /tmp/stage8e | tee stage10-player-residual-diagnostic.json
      - name: Run Stage 11 teammate-adjusted replacement proxy real-match diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node research/match-intelligence/stage11-replacement-proxy.cjs /tmp/stage8e | tee stage11-replacement-proxy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage11-replacement-proxy
          path: stage11-replacement-proxy.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage10-player-residual-diagnostic
          path: stage10-player-residual-diagnostic.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8e-lagged-xi-results
          path: stage8e-lagged-xi-results.json
          retention-days: 90
