name: Refresh factual football fixtures
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: fixture-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified upcoming fixtures (requires API secret)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/refresh_fixtures.py
      - name: Build research screening queue
        run: python scripts/build_candidate_queue.py
      - name: Verify eligible completed football predictions
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/verify_football_results.py
      - name: Commit updated research and result feeds
        run: |
          files=()
          for file in fixture-feed.json candidate-queue.json results-feed.json; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No feed files exist; nothing to publish."
            exit 0
          fi
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update fixture and research screening queues"
            git push
          else
            echo "No feed changes to publish."
          fi
