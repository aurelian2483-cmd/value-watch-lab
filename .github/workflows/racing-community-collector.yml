name: Collect racing community research (candidate observations)
on:
  push:
    branches: [main]
    paths: ['scripts/collect_racing_community.py', 'racing-research/community-feeds.json', '.github/workflows/racing-community-collector.yml']
  schedule:
    - cron: '15 6,9,12,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: racing-community-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public candidate observations
        run: python scripts/collect_racing_community.py
      - name: Commit evidence with no publication promotion
        run: |
          if ! git diff --quiet -- racing-research/source-observations.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add racing-research/source-observations.json
            git commit -m "Archive candidate community racing observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
