name: Experiment 46 verify pinned original timestamp proof
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment46_verify_pinned_timestamp.py'
      - 'research/experiment46-pinned-ots-evidence.json'
      - '.github/workflows/experiment46-verify-pinned-timestamp.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements-model-smoke.txt
          pip install opentimestamps-client==0.7.2
      - name: Reverify original proof without resubmitting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/experiment46_verify_pinned_timestamp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment46-pinned-timestamp-review
          path: /tmp/experiment46/
          retention-days: 90
          if-no-files-found: warn
