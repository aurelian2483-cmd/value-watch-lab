name: Experiment 34 structured fixture check
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment34_structured_fixture_check.py'
      - '.github/workflows/experiment34-structured-fixtures.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Extract structured Sky Sports events and crosscheck ESPN
        run: python scripts/experiment34_structured_fixture_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment34-structured-fixture-review
          path: /tmp/experiment34-structured-review.json
          if-no-files-found: warn
          retention-days: 14
