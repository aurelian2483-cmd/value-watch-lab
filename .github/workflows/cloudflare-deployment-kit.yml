name: Cloudflare disabled deployment kit QA
on:
  pull_request:
    paths:
      - 'research/cloudflare-deployment-kit/**'
      - '.github/workflows/cloudflare-deployment-kit.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check research/cloudflare-deployment-kit/preflight.mjs
      - run: node --test research/cloudflare-deployment-kit/test_preflight.mjs
      - run: python -B -m unittest discover -s research/cloudflare-deployment-kit -p 'test_*.py' -v
      - run: python -B research/cloudflare-deployment-kit/package.py "$RUNNER_TEMP/cloudflare-kit"
      - run: npm install --prefix "$RUNNER_TEMP/sky-wrangler" --no-audit --no-fund wrangler@4.165.0
      - name: Verify exact extracted package with Wrangler offline dry run
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          mkdir "$RUNNER_TEMP/cloudflare-extracted"
          unzip -q "$RUNNER_TEMP/cloudflare-kit/Sky-Research-Cloudflare-Disabled.zip" -d "$RUNNER_TEMP/cloudflare-extracted"
          cd "$RUNNER_TEMP/cloudflare-extracted"
          "$RUNNER_TEMP/sky-wrangler/node_modules/.bin/wrangler" deploy --dry-run --outdir preview
      - run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-disabled-deployment-kit
          path: ${{ runner.temp }}/cloudflare-kit/
          retention-days: 14
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows preflight unit tests
        run: |
          node --check research/cloudflare-deployment-kit/preflight.mjs
          node --test research/cloudflare-deployment-kit/test_preflight.mjs
      - name: Build and extract the exact package
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "cloudflare-kit"
          python -B research/cloudflare-deployment-kit/package.py $kit
          $extract = Join-Path $env:RUNNER_TEMP "cloudflare-extracted"
          Expand-Archive -LiteralPath (Join-Path $kit "Sky-Research-Cloudflare-Disabled.zip") -DestinationPath $extract
          "SKY_EXTRACTED=$extract" >> $env:GITHUB_ENV
      - name: Windows Wrangler dry run and authentication gate
        run: |
          $dryRun = Join-Path $env:RUNNER_TEMP "cloudflare-dry-run"
          New-Item -ItemType Directory -Path $dryRun | Out-Null
          Copy-Item -Path (Join-Path $env:SKY_EXTRACTED "*") -Destination $dryRun -Recurse
          Push-Location $dryRun
          try {
            npx --yes wrangler@4.165.0 deploy --dry-run --outdir preview
            if ($LASTEXITCODE -ne 0) { throw "Windows Wrangler dry run failed" }
          } finally {
            Pop-Location
          }
          Push-Location $env:SKY_EXTRACTED
          try {
            node preflight.mjs 00000000000000000000000000000000
            if ($LASTEXITCODE -ne 1) { throw "Unauthenticated preflight did not fail closed" }
            if (Test-Path wrangler.account.json) { throw "Account config must not be created without verified authentication" }
          } finally {
            Pop-Location
          }
      - run: if (git status --porcelain) { throw "Working tree was modified" }
