name: Operations Control Centre smoke test (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'ops-control/**'
      - 'tests/test_ops_control.cjs'
      - 'tests/test_ops_history.cjs'
      - '.github/workflows/ops-control-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops-control/**'
      - 'tests/test_ops_control.cjs'
      - '.github/workflows/ops-control-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and read-only operations desk regression
        run: |
          node --check ops-control/app.js
          node tests/test_ops_control.cjs
          node tests/test_ops_history.cjs
