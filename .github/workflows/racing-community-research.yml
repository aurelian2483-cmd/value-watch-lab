name: Racing community research collector
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 7-19 * * *'
permissions:
  contents: write
concurrency:
  group: racing-community-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source-attributed racing evidence
        run: python scripts/collect_racing_community.py
      - name: Check JSON output and evidence tests
        run: |
          python -m json.tool racing-research/source-observations.json > /dev/null
          python -m unittest discover -s tests -p test_racing_community_evidence.py
      - name: Commit updated research archive
        run: |
          if ! git diff --quiet -- racing-research/source-observations.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add racing-research/source-observations.json
            git commit -m 'Update source-attributed racing research archive'
            git push
          fi
