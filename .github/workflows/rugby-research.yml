name: Rugby Union and Rugby League schedule collection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_rugby.py'
      - '.github/workflows/rugby-research.yml'
  schedule:
    - cron: '35 7 * * *'
    - cron: '35 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rugby-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/collect_rugby.py
      - run: python -u scripts/collect_rugby.py
      - name: Validate isolated research data
        run: |
          python - <<'PY'
          import json
          d=json.load(open('rugby-research-data.json'))
          assert d['schema_version']==1 and d['research_only'] is True
          assert d['publication_gate']=='BLOCKED' and d['model_validation']=='UNVALIDATED'
          assert all(x['code'] in ('RU','RL') and x['forecast_eligible'] is False for x in d['upcoming_fixtures'])
          print('Rugby fixtures:',len(d['upcoming_fixtures']))
          PY
      - name: Publish confirmed fixtures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rugby-research-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-observed Rugby Union and Rugby League fixtures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
