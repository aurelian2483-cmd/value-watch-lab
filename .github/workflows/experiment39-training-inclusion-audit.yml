name: Experiment 39 training inclusion and cutoff audit
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment39_training_inclusion_audit.py'
      - '.github/workflows/experiment39-training-inclusion-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Verify model training against independently audited match results
        run: python scripts/experiment39_training_inclusion_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment39-training-inclusion-review
          path: /tmp/experiment39/report.json
          retention-days: 14
          if-no-files-found: warn
