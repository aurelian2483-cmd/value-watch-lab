name: Cardano race video prototype QA
on:
  push:
    branches: [feature/cardano-race-video-prototype]
  pull_request:
    paths:
      - 'race-video-lab/**'
      - 'cardano-lab-widget.*'
      - 'index.html'
      - 'paper-lab/index.html'
      - 'tests/cardano_lab_widget_browser.cjs'
      - 'tests/race_video_browser.cjs'
      - '.github/workflows/cardano-race-video-qa.yml'
  workflow_dispatch:
jobs:
  race-video-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install project dependencies
        run: npm ci
      - name: Race video browser smoke test
        run: node tests/race_video_browser.cjs
      - name: Main dashboard Cardano widget smoke test
        run: node tests/cardano_lab_widget_browser.cjs
