name: Experiment registry validation
on:
  pull_request:
    paths:
      - 'research/mathematical-library/experiment-registry*.mjs'
      - '.github/workflows/experiment-registry-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registry unit and lifecycle tests
        run: node --test research/mathematical-library/experiment-registry*.test.mjs
