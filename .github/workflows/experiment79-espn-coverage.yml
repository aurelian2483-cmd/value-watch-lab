name: Experiment 79 ESPN coverage audit
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit ESPN future fixture coverage
        run: python scripts/experiment79_espn_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment79-espn-coverage-audit
          path: /tmp/experiment79/coverage-report.json
          retention-days: 90
          if-no-files-found: warn
