name: Experiment 60 prospective readiness fail-closed audit
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment60-readiness.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Assess prospective readiness without changing ledger
        run: python scripts/experiment60_readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment60-readiness-review
          path: /tmp/experiment60/
          retention-days: 90
          if-no-files-found: warn
