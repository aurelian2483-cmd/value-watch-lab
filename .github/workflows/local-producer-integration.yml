name: Local producer integration QA
on:
  pull_request:
    paths:
      - 'research/local-producer-integration/**'
      - '.github/workflows/local-producer-integration.yml'
permissions:
  contents: read
  actions: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline receipt contracts
        run: python -B -m unittest discover -s research/local-producer-integration -p 'test_*.py' -v
      - name: Retrieve only the exact accepted PR186 website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,sys,zipfile
          repo=os.environ['GITHUB_REPOSITORY']
          rid=int(os.environ['GITHUB_REPOSITORY_ID'])
          assert repo=='aurelian2483-cmd/value-watch-lab' and rid==1440096185
          ep=f'repos/{repo}/actions/artifacts/14982285777'
          a=json.loads(subprocess.check_output(['gh','api',ep],timeout=60))
          w=a['workflow_run']
          assert a['id']==14982285777 and a['name']=='integrated-research-website-evidence' and not a['expired']
          assert a['digest']=='sha256:2bb73af8aadd9d5bd66e4def1d2d4296987b0dde746d2d63ae27a201ad9ae248'
          assert w['id']==45524893731 and w['head_sha']=='4f6aab6bc5a545fe4323fd4f937eb3abdad00382' and w['repository_id']==rid and w['head_repository_id']==rid
          raw=subprocess.check_output(['gh','api',ep+'/zip'],timeout=60)
          assert len(raw)==a['size_in_bytes']<=2*1024*1024
          assert hashlib.sha256(raw).hexdigest()==a['digest'].split(':')[1]
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              inner=z.read('Sky-Research-Integrated-Website.zip')
          sys.path.insert(0,'research/integrated-website')
          from package import verify
          manifest=verify(inner,'832817ec2d60e2eb6e6b4c49826d2b2c90f0db4a1fab6512bb8a61b772e2c9d6')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          site=root/'accepted-site';site.mkdir()
          with zipfile.ZipFile(io.BytesIO(inner)) as z:
              for name in ['index.html','status.json']:
                  (site/name).write_bytes(z.read(name))
          (root/'producer-store').mkdir()
          (root/'producer-qa').mkdir()
          print('PASS original accepted website release manifest and byte fingerprints')
          PY
      - name: Install locked browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run actual fixed local producer cycles and browser integration
        run: |
          node research/local-producer-integration/browser-acceptance.mjs "$RUNNER_TEMP/accepted-site" "$RUNNER_TEMP/producer-store" "$RUNNER_TEMP/producer-qa" "$(git rev-parse HEAD)"
          cp "$RUNNER_TEMP/producer-store/"batch-*.json "$RUNNER_TEMP/producer-qa/"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-producer-integration-evidence
          path: ${{ runner.temp }}/producer-qa/
          retention-days: 14
          if-no-files-found: warn
