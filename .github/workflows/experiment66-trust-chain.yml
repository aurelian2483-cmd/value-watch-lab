name: Experiment 66 independent trust chain diagnostics
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment66-trust-chain.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Experiment 64 original evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "experiment64-timestamp-review" and .expired == false and .workflow_run.head_branch == "research/prospective-100")] | sort_by(.created_at) | last | .workflow_run.id')
          test -n "$RUN_ID"
          test "$RUN_ID" != "null"
          mkdir -p /tmp/experiment65-original
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name experiment64-timestamp-review --dir /tmp/experiment65-original
      - name: Inspect timestamp chain without treating downloaded root as trusted
        run: python scripts/experiment66_trust_chain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment66-trust-chain-review
          path: /tmp/experiment66/
          retention-days: 90
          if-no-files-found: warn
