name: Experiment 37 training cutoff and attestation review
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment37_cutoff_attestation.py'
      - '.github/workflows/experiment37-cutoff-attestation.yml'
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Independently corroborate training dates and hash-link review attestation
        run: python scripts/experiment37_cutoff_attestation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment37-cutoff-attestation-review
          path: /tmp/experiment37/
          retention-days: 14
          if-no-files-found: warn
