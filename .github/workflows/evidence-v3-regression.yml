name: Evidence v3 regression
on:
  push:
    paths:
      - 'paper-lab/**'
      - 'tests/test_evidence_v3.cjs'
      - 'racing-future-data.json'
      - '.github/workflows/evidence-v3-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify four-sport evidence gates
        run: node tests/test_evidence_v3.cjs
      - name: Check deployment HTML and critical assets
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('paper-lab/index.html').read_text()
          for asset in ('evidence-v3.js','desk.js','engine.js','core.js'):
              assert f'src="{asset}' in h, f'Missing asset: {asset}'
              assert Path('paper-lab',asset).is_file(), f'Asset not found: {asset}'
          assert 'Paper research' in h
          print('Dashboard HTML and assets verified')
          PY
      - name: Validate source-observed future racing payload
        run: |
          python - <<'PY'
          import json,sys,datetime
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from collect_future_racing import validate_publishable_snapshot
          x=json.loads(Path('racing-future-data.json').read_text())
          validate_publishable_snapshot(x)
          races=x['races']
          assert len({r['race_id'] for r in races})==len(races)
          dates={d['date'] for d in x['days']}
          for r in races:
              assert r['scheduled_start_time_utc'][:10] in dates
              assert datetime.datetime.fromisoformat(r['observation_timestamp_utc'].replace('Z','+00:00')) < datetime.datetime.fromisoformat(r['scheduled_start_time_utc'].replace('Z','+00:00'))
              if r.get('runners'):
                  assert r['runner_source'] and len(r['runner_source_sha256'])==64
                  assert len({h['horse_id'] for h in r['runners']})==len(r['runners'])
                  assert all(h['win_probability'] is None for h in r['runners'])
                  assert r['forecast_eligible'] is False
                  assert r['declaration_stage']=='NOT_VERIFIED'
          print('Seven-day source payload validated; counts are provider observations, not fixed fixtures')
          PY
