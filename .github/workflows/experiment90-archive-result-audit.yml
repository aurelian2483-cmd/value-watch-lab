name: Experiment 90 archived post-match result audit
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify final scores independently and calculate paper-only metrics
        run: python scripts/experiment90_archive_result_scoring.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment90-archive-result-audit
          path: /tmp/experiment90/report.json
          retention-days: 90
          if-no-files-found: warn
