name: Experiment 17 official fixture cross-check
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/official_fixture_crosscheck.py'
      - '.github/workflows/official-fixture-crosscheck.yml'
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check candidates (review only)
        run: python scripts/official_fixture_crosscheck.py --output /tmp/official-crosscheck.json
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: official-fixture-review
          path: /tmp/official-crosscheck.json
          retention-days: 7
