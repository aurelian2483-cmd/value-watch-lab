name: Experiment 82 research dashboard feed
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect ESPN research fixture coverage
        run: python scripts/experiment79_espn_coverage.py
      - name: Generate safe dashboard feed
        run: python scripts/experiment82_dashboard_feed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment82-research-dashboard-data
          path: /tmp/experiment82/dashboard-data.json
          retention-days: 90
          if-no-files-found: warn
