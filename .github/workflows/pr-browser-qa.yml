name: PR browser QA (no deployment)
on:
  push:
    branches: [codex/value-watch-development]
  pull_request:
    branches: [copilot/evidence-research-handover, main, codex/value-watch-development, codex/all-sports-website-integration, codex/phase66-compact-preview, codex/phase67-result-evidence, codex/reference-workspace-redesign, codex/reference-fixture-integration]
    paths:
      - 'index.html'
      - 'analyst/**'
      - 'football-match/**'
      - 'fixture-detail/**'
      - 'market-intelligence/**'
      - 'pro-design.css'
      - 'visual-preview/**'
      - 'validation-centre/**'
      - 'pro-home.js'
      - 'pro-sources.js'
      - 'reference-workspace.css'
      - 'reference-workspace.js'
      - 'sports-watch/**'
      - 'paper-lab/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/pr-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Verify research browser interactions (desktop/mobile/racing/paper)
        env:
          VW_DESK_SCREENSHOTS: work/browser-qa/controlled-market-prices
        run: |
          if test -f scripts/dashboard_shell_browser_qa.cjs; then node scripts/dashboard_shell_browser_qa.cjs; fi
          npm run test:browser
          if test -f scripts/current_odds_browser_qa.cjs; then node scripts/current_odds_browser_qa.cjs; fi
          node scripts/pl_comparison_browser_qa.cjs
          node tests/test_pro_design.cjs
          node scripts/pro_design_browser_qa.cjs
          node scripts/darts_browser_qa.cjs
          node --test sports-watch/*.test.cjs
          node sports-watch/browser-qa.cjs
          if test -f scripts/all_sports_browser_qa.cjs; then node scripts/all_sports_browser_qa.cjs; fi
          if test -f scripts/football_match_browser_qa.cjs; then node scripts/football_match_browser_qa.cjs; fi
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/phase66-compact-preview'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: work/compact-baseline
          persist-credentials: false
      - name: Capture approved compact preview before and after
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/phase66-compact-preview'
        run: |
          cp scripts/all_sports_browser_qa.cjs work/compact-baseline/scripts/
          node work/compact-baseline/scripts/all_sports_browser_qa.cjs --compact-preview --baseline
          mv work/compact-baseline/work/browser-qa/compact-preview work/browser-qa/compact-before
          node scripts/all_sports_browser_qa.cjs --compact-preview
          mv work/browser-qa/compact-preview work/browser-qa/compact-after
      - name: Verify nine research lanes in the approved compact design
        if: github.head_ref == 'codex/phase69-free-sport-lanes' || github.head_ref == 'codex/reference-workspace-redesign' || github.head_ref == 'codex/reference-fixture-integration' || github.head_ref == 'codex/exact-cross-sport-navigation'
        run: node scripts/all_sports_browser_qa.cjs --compact-preview
      - name: Save QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-qa-evidence
          path: work/browser-qa/
          retention-days: 14

  main-data-integration:
    name: Combined PR code with current main snapshots (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Overlay current main's tracked research snapshots in runner only
        shell: bash
        run: |
          set -euo pipefail
          echo "Tested combined code HEAD: $(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          echo "Main data commit: $(git rev-parse FETCH_HEAD)"
          # Only data, never scripts, workflows, HTML, CSS or model code.
          files=(
            football-expanded-data.json
            horse-challenger-data.json
            horse-context-data.json
            horse-model-data.json
            horse-predictions-data.json
            international-analysis-data.json
            international-football-data.json
            other-sports-data.json
            racing-future-coverage.json
            racing-future-data.json
            racing-research-data.json
            racing-research/source-observations.json
            research-dashboard-data.json
            research-history.json
            prediction-ledger.json
            research/result-review-status.json
            research/provider-result-observations.json
            research/secondary-result-evidence.json
            rugby-research-data.json
          )
          for path in "${files[@]}"; do
            git cat-file -e "FETCH_HEAD:$path"
            git restore --source=FETCH_HEAD --worktree -- "$path"
          done
          echo "Overlay verified: ${#files[@]} current-main data snapshots"
          git diff --name-only
          # Files are overlaid in ephemeral checkout only. Nothing is committed.
      - name: Apply audited racing schedule classification to the runner snapshot
        run: python scripts/reconcile_racing_schedule_observation.py
      - name: Install pinned QA tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run JS and Python regression against overlaid snapshots
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for script in paper-lab/*.js; do node --check "$script"; done
          python -m unittest discover -s tests
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Test real-main snapshots and synthetic browser workflows
        run: |
          npm run test:browser
          if test -f scripts/current_odds_browser_qa.cjs; then node scripts/current_odds_browser_qa.cjs; fi
          node scripts/football_match_browser_qa.cjs
          if test -f scripts/all_sports_browser_qa.cjs; then node scripts/all_sports_browser_qa.cjs; fi
      - name: Retain integration QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-data-integration-evidence
          path: work/browser-qa/
          retention-days: 14
