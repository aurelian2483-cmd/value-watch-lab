name: H2H verified archive research backtest
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/run_h2h_archive_backtest.py'
      - 'scripts/build_h2h_historical_context.py'
      - 'scripts/football_h2h_backtest.py'
      - 'research/football-expanded-results/v1/verified.json'
      - '.github/workflows/football-h2h-archive-backtest.yml'
permissions:
  contents: read
jobs:
  archive-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_football_h2h.py' -v
          python -m unittest discover -s tests -p 'test_football_h2h_backtest.py' -v
      - name: Collect historical H2H context with source receipts
        run: |
          mkdir -p /tmp/h2h-evaluation
          python scripts/build_h2h_historical_context.py /tmp/h2h-evaluation/history.json /tmp/h2h-evaluation/source-receipts.json
      - name: Run verified-ledger backtest if archived results exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h2h-evaluation
          if [ -f research/football-expanded-results/v1/verified.json ]; then
            python scripts/run_h2h_archive_backtest.py /tmp/h2h-evaluation/history.json /tmp/h2h-evaluation/report.json
          else
            printf '%s\\n' '{"status":"MISSING_VERIFIED_LEDGER","model_validation":"UNVALIDATED","publication_gate":"BLOCKED","model_comparison_performed":false}' > /tmp/h2h-evaluation/report.json
          fi
      - name: Audit research report and print reproducible summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/h2h-evaluation/report.json")
          report = json.loads(p.read_text())
          assert report["model_validation"] == "UNVALIDATED"
          assert report["publication_gate"] == "BLOCKED"
          sensitivity = report.get("exploratory_fixed_weight_sensitivity")
          if sensitivity:
              assert sensitivity["weights_selected"] is False
              assert sensitivity["predictive_validation"] is False
              weights = sensitivity["comparisons"]
              assert len(weights) == 7
              print("Unique verified fixtures:", report["unique_verified_fixtures"])
              print("History rows:", report["history_rows_supplied"])
              for item in weights:
                  eligible = item["h2h_eligible_subset"]
                  print(json.dumps({
                      "weight": item["weight"],
                      "eligible_fixtures": eligible["sample_size"],
                      "eligible_delta_brier": eligible["delta_brier_challenger_minus_baseline"],
                      "eligible_delta_log_loss": eligible["delta_log_loss_challenger_minus_baseline"],
                  }, sort_keys=True))
              print("30% fixture diagnostics:", json.dumps(
                  report.get("h2h_eligible_fixture_diagnostics_at_30pct", []),
                  sort_keys=True))
          else:
              print("No exploratory comparison; reason:", report.get("status"))
          print("Research only. Model UNVALIDATED. Publication BLOCKED.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h2h-verified-archive-research-report
          path: |
            /tmp/h2h-evaluation/report.json
            /tmp/h2h-evaluation/source-receipts.json
          retention-days: 30
