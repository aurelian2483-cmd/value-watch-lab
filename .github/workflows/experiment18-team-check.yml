name: Experiment 18 team compatibility
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment18_team_check.py'
      - '.github/workflows/experiment18-team-check.yml'
permissions:
  contents: read
jobs:
  team-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixture team names against current EPL model input
        run: python scripts/experiment18_team_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment18-team-review
          path: /tmp/experiment18-review.json
          retention-days: 7
