name: Operations Director scheduled monitoring
on:
  schedule:
    # Fixed UTC times. UK local times differ during BST; GitHub may delay scheduled jobs.
    - cron: '17 7,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops-control/scheduled-monitor.cjs'
      - 'tests/test_ops_scheduled.cjs'
      - '.github/workflows/operations-scheduled-monitor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops-control/scheduled-monitor.cjs'
      - 'tests/test_ops_scheduled.cjs'
      - '.github/workflows/operations-scheduled-monitor.yml'
concurrency:
  group: operations-scheduled-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test no-write scheduled monitor
        run: |
          node --check ops-control/scheduled-monitor.cjs
          node tests/test_ops_scheduled.cjs
  scheduled-briefing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit current main-branch repository snapshots
        run: node ops-control/scheduled-monitor.cjs ops-control/out
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-briefing-${{ github.run_id }}
          path: ops-control/out/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish briefing to one Director issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const owner=context.repo.owner, repo=context.repo.repo;
            const title='[Operations Control Centre] Director scheduled briefing';
            const message=fs.readFileSync('ops-control/out/briefing.md','utf8');
            const marker='<!-- ops-monitor-run:'+context.runId+' -->';
            const footer='\n\n---\nGenerated by scheduled GitHub Actions. Reports describe main-branch research snapshots, not verified Pages uptime or independent betting expert approval. To stop notifications, close this issue.\n';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100});
            let issue=issues.find(i=>!i.pull_request && i.title===title);
            if(issue?.state==='closed'){
              core.notice('Director issue intentionally closed; report remains in Actions artifact and summary.');
              return;
            }
            if(issue?.body?.includes(marker)){
              core.notice('This workflow run has already posted its report; duplicate suppressed.');
              return;
            }
            const body=marker+'\n'+message+footer;
            if(!issue){
              const created=await github.rest.issues.create({owner,repo,title,body});
              core.notice('Created Director briefing issue #'+created.data.number);
            }else{
              await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:marker+'\n'+message});
              core.notice('Updated Director briefing issue #'+issue.number);
            }
