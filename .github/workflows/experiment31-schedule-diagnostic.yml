name: Experiment 31 fixture coverage diagnosis
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment31_schedule_diagnostic.py'
      - '.github/workflows/experiment31-schedule-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Diagnose external schedule coverage
        run: python scripts/experiment31_schedule_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment31-schedule-coverage-diagnostic
          path: /tmp/experiment31-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
