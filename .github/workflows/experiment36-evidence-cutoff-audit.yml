name: Experiment 36 evidence binding and cutoff audit
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment36_evidence_cutoff_audit.py'
      - '.github/workflows/experiment36-evidence-cutoff-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Audit two-source binding and training cutoff (read-only)
        run: python scripts/experiment36_evidence_cutoff_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment36-read-only-evidence-review
          path: /tmp/experiment36/
          retention-days: 14
          if-no-files-found: warn
