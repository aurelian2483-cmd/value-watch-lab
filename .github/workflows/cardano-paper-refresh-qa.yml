name: Cardano paper refresh provenance QA
on:
  push:
    branches: [feature/cardano-race-video-prototype]
    paths:
      - 'paper-lab/desk.js'
      - 'paper-lab/transport.js'
      - 'tests/test_refresh_provenance.cjs'
      - 'tests/test_sports_coverage_diagnostics.cjs'
      - 'tests/test_cardano_coverage_summary.cjs'
      - 'tests/test_cardano_source_failures.cjs'
      - 'tests/test_cardano_degraded_refresh.cjs'
      - 'scripts/sports_coverage_report.cjs'
      - 'scripts/cardano_coverage_summary.cjs'
      - '.github/workflows/cardano-paper-refresh-qa.yml'
  workflow_dispatch:
concurrency:
  group: cardano-paper-refresh-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  refresh-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check paper-lab/desk.js
          node --check paper-lab/transport.js
          node tests/test_refresh_provenance.cjs
          node tests/test_sports_coverage_diagnostics.cjs
          node tests/test_cardano_coverage_summary.cjs
          node tests/test_cardano_source_failures.cjs
          node tests/test_cardano_degraded_refresh.cjs
      - name: Export seven-day sports and eligibility diagnostic
        run: node scripts/sports_coverage_report.cjs > cardano-sports-coverage.json
      - name: Publish coverage and exclusion summary
        run: node scripts/cardano_coverage_summary.cjs cardano-sports-coverage.json
      - name: Upload optional coverage artifact
        id: coverage-upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: cardano-sports-coverage
          path: cardano-sports-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Report optional artifact upload failure
        if: steps.coverage-upload.outcome == 'failure'
        run: |
          echo '::warning::Coverage tests passed, but the optional diagnostic artifact upload failed or timed out.'
          echo 'Coverage JSON remains in the job workspace; the upload did not complete.' >> "$GITHUB_STEP_SUMMARY"
