name: Experiment 49 persistent ledger append preflight
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment49_persistent_append_preflight.py'
      - '.github/workflows/experiment49-persistent-append-preflight.yml'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Verify remote ledger and simulate guarded append
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/experiment49_persistent_append_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment49-persistent-append-preflight-review
          path: /tmp/experiment49/
          retention-days: 60
          if-no-files-found: warn
