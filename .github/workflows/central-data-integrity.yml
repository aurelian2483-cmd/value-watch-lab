name: Central data integrity validation
on:
  pull_request:
    paths:
      - 'research/central-data-intelligence/**'
      - '.github/workflows/central-data-integrity.yml'
      - 'research/mathematical-library/experiment-registry-*-evidence.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test manifests and source reconciliation
        run: node --test research/central-data-intelligence/*.test.mjs
      - name: Generate read-only manifest from checked-out source
        run: |
          mkdir -p "$RUNNER_TEMP/central-data-integrity"
          node research/central-data-intelligence/manifest.mjs "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/central-data-integrity/manifest.json"
          node research/central-data-intelligence/source-audit.mjs "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/central-data-integrity/source-audit.json"
          node research/central-data-intelligence/quality-report.mjs "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)" json > "$RUNNER_TEMP/central-data-integrity/quality-report.json"
          node research/central-data-intelligence/quality-report.mjs "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)" html > "$RUNNER_TEMP/central-data-integrity/index.html"
          node research/central-data-intelligence/integration.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/unavailable-local-registry" "$(git rev-parse HEAD)" json > "$RUNNER_TEMP/central-data-integrity/integrated-status.json"
          node research/central-data-intelligence/integration.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/unavailable-local-registry" "$(git rev-parse HEAD)" html > "$RUNNER_TEMP/central-data-integrity/integrated-status.html"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: central-data-integrity-manifest
          path: ${{ runner.temp }}/central-data-integrity/
          retention-days: 7
          if-no-files-found: error
