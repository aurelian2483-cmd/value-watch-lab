name: Horse racing experimental discovery
on:
  push:
    branches: [main]
    paths: ['scripts/discover_horse_races.py', 'scripts/horse_reference_baseline.py', 'scripts/horse_secondary_source.py', 'tests/test_horse_discovery.py', 'tests/test_horse_reference.py', 'tests/test_horse_secondary.py', 'scripts/enrich_horse_runners.py', 'scripts/horse_market.py', 'tests/test_horse_market.py', 'tests/test_horse_runners.py', '.github/workflows/horse-research-discovery.yml', 'scripts/horse_model_pipeline.py', 'tests/test_horse_model.py', 'scripts/horse_challenger.py', 'tests/test_horse_challenger.py', 'research/horse-challenger/model-v1.json']
  schedule:
    - cron: '10,40 6-22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horse-research-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test race discovery controls
        run: python -m unittest discover -s tests -p 'test_horse*.py'
      - name: Collect single-source UK and Ireland race observations
        run: python scripts/discover_horse_races.py
      - name: Collect runner identities, non-runners and dated form
        run: python scripts/enrich_horse_runners.py
      - name: Freeze equal-chance research references before races
        run: python scripts/horse_reference_baseline.py
      - name: Optional second-publisher race and result cross-check
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python scripts/horse_secondary_source.py
      - name: Archive experimental form forecasts and track provisional final results
        run: python scripts/horse_model_pipeline.py
      - name: Freeze trained challenger estimates separately
        run: python scripts/horse_challenger.py
      - uses: actions/upload-artifact@v4
        with:
          name: horse-research-discovery
          path: |
            /tmp/horse-research/racing-research-data.json
            /tmp/horse-research/horse-model-data.json
            /tmp/horse-research/horse-challenger-data.json
            /tmp/horse-research/*audit.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: horse-research-source-snapshots
          path: |
            /tmp/horse-research/*.html
            /tmp/horse-research/runner-sources/
            /tmp/horse-research/result-sources/
            /tmp/horse-research/secondary-source-snapshots/
          retention-days: 30
      - name: Publish experimental observations only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/horse-research/racing-research-data.json racing-research-data.json
          cp /tmp/horse-research/horse-model-data.json horse-model-data.json
          cp /tmp/horse-research/horse-challenger-data.json horse-challenger-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- racing-research-data.json horse-model-data.json horse-challenger-data.json
          git add -- research/horse-challenger
          if [ -d research/horse-reference-archive ]; then git add -- research/horse-reference-archive; fi
          if [ -d research/horse-form-archive ]; then git add -- research/horse-form-archive; fi
          if [ -d research/horse-results ]; then git add -- research/horse-results; fi
          if [ -d research/horse-secondary-results ]; then git add -- research/horse-secondary-results; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh experimental racing discovery observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

