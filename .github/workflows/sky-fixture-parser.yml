name: Sky fixture parser validation
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/sky_fixture_parser.py'
      - '.github/workflows/sky-fixture-parser.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Parse exact Sky fixture dates and kickoff
        run: python scripts/sky_fixture_parser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-fixture-parser-review
          path: /tmp/sky-parser-review.json
          if-no-files-found: warn
