name: Racing community import and evidence regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_racing_community_evidence.py'
      - 'scripts/collect_racing_community.py'
      - '.github/workflows/racing-community-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collectors compile without network
        run: python -m py_compile scripts/collect_racing_community.py scripts/primary_racing_posts.py scripts/published_racing_selections.py
      - name: Test racing evidence, integration and market rules
        run: |
          python -m unittest discover -s tests -p 'test_racing_community_evidence.py' -v
          python -m unittest discover -s tests -p 'test_racing_collector_integration.py' -v
          python -m unittest discover -s tests -p 'test_racing_market_audit.py' -v
      - name: Do not mutate racing archives
        run: git diff --exit-code -- racing-research/source-observations.json racing-research-data.json
