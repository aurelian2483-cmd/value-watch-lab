name: Value Watch model integration (retrospective, no publishing)
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/model_integration_smoke.py'
      - '.github/workflows/model-integration-smoke.yml'
permissions:
  contents: read
jobs:
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Live data to model retrospective smoke test
        run: python scripts/model_integration_smoke.py > model-smoke-results.json
      - name: Display result
        run: python -c "import json; d=json.load(open('model-smoke-results.json')); print(d['status'],d['forecast_count'],d['mode'])"
      - uses: actions/upload-artifact@v4
        with:
          name: retrospective-model-smoke
          path: model-smoke-results.json
          retention-days: 7
