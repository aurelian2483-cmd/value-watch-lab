name: Horse Racing Evidence Dashboard — isolated research

on:
  push:
    branches:
      - research/horse-v3-isolated
    paths:
      - 'scripts/build_horse_evidence_dashboard.py'
      - 'tests/test_build_horse_evidence_dashboard.py'
      - '.github/workflows/horse-evidence-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/horse-v3-isolated
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dashboard input, freshness and escaping
        run: |
          python -m unittest discover -s tests -p 'test_build_horse_evidence_dashboard.py' -v
      - name: Assemble current research-only snapshot
        run: |
          python scripts/build_horse_evidence_dashboard.py --output /tmp/horse-research-health
      - name: Publish private-to-run evidence artifact, not the website
        uses: actions/upload-artifact@v4
        with:
          name: horse-research-health-readonly
          path: /tmp/horse-research-health/
          retention-days: 60
          if-no-files-found: error
