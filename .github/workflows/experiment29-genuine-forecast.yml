name: Experiment 29 genuine forecast preflight
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment29_genuine_forecast_preflight.py'
      - '.github/workflows/experiment29-genuine-forecast.yml'
permissions:
  contents: read
jobs:
  genuine-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Generate real-model candidates with publishing disabled
        run: python scripts/experiment29_genuine_forecast_preflight.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: experiment29-real-model-unverified-forecasts
          path: /tmp/experiment29-review.json
          retention-days: 14
