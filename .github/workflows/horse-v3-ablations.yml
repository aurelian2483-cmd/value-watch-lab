name: V3 fixed-context ablation research unit tests

on:
  push:
    branches:
      - research/horse-v3-isolated
    paths:
      - '.github/workflows/horse-v3-ablations.yml'
      - 'scripts/horse_v3_experimental_ablations.py'
      - 'tests/test_horse_v3_experimental_ablations.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-isolated-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed V3 unit tests
        run: |
          git rev-parse HEAD
          python -m unittest discover -s tests -p test_horse_v3_experimental_ablations.py -v
