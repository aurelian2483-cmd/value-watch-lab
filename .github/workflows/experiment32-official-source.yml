name: Experiment 32 official source probe
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment32_official_source_probe.py'
      - '.github/workflows/experiment32-official-source.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing model dependencies required by transitive imports
        run: pip install -r requirements-model-smoke.txt
      - name: Inspect live official Premier League source
        run: python scripts/experiment32_official_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment32-official-source-review
          path: /tmp/experiment32-official-source.json
          if-no-files-found: warn
          retention-days: 14
