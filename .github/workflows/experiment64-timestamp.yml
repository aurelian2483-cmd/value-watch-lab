name: Experiment 64 preserve forecast and request independent timestamp
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment64-timestamp.yml'
permissions:
  contents: read
  actions: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve original Experiment 63 artifact without modifying it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "experiment63-new-fixture-forecast-review" and .expired == false and .workflow_run.head_branch == "research/prospective-100")] | sort_by(.created_at) | last | .workflow_run.id')
          test -n "$RUN_ID"
          test "$RUN_ID" != "null"
          mkdir -p /tmp/experiment63-original
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name experiment63-new-fixture-forecast-review --dir /tmp/experiment63-original-download
          cp /tmp/experiment63-original-download/experiment63/forecast.json /tmp/experiment63-original/forecast.json
      - name: Freeze original bytes and request third-party timestamp
        run: python scripts/experiment64_timestamp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment64-timestamp-review
          path: /tmp/experiment64/
          retention-days: 90
          if-no-files-found: warn
