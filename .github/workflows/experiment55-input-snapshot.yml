name: Experiment 55 prospective input snapshot capture
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment55-input-snapshot.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Capture exact CSV bytes and training-row manifest
        run: python scripts/experiment55_input_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment55-input-snapshot-review
          path: /tmp/experiment55/
          retention-days: 90
          if-no-files-found: warn
