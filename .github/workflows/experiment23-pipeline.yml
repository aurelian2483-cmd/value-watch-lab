name: Experiment 23 end-to-end ledger dry run
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment23_pipeline.py'
      - '.github/workflows/experiment23-pipeline.yml'
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-smoke.txt
      - run: pip install -r requirements-model-smoke.txt
      - name: Calculate predictions and validate evidence without publishing
        run: python scripts/experiment23_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment23-unpublished-ledger-review
          path: /tmp/experiment23/review.json
          retention-days: 7
