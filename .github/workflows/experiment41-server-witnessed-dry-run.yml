name: Experiment 41 server-witnessed forecast dry run
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment41_server_witnessed_dry_run.py'
      - '.github/workflows/experiment41-server-witnessed-dry-run.yml'
permissions:
  contents: read
  actions: read
jobs:
  dry-run:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Check GitHub server run and generate pre-kickoff evidence
        run: python scripts/experiment41_server_witnessed_dry_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment41-server-witnessed-review
          path: /tmp/experiment41/
          retention-days: 30
          if-no-files-found: warn
