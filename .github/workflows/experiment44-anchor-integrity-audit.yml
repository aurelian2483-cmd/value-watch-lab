name: Experiment 44 fixed anchor and ledger tamper tests
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment44_anchor_integrity_audit.py'
      - 'research/experiment44-ledger-anchor.json'
      - '.github/workflows/experiment44-anchor-integrity-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Verify anchor, receipt and tamper rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/experiment44_anchor_integrity_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment44-anchor-integrity-review
          path: /tmp/experiment44/
          retention-days: 30
          if-no-files-found: warn
