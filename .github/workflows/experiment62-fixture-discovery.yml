name: Experiment 62 dynamically discover new future fixtures
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment62-fixture-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and cross-check fixtures with corrected aliases
        run: python scripts/experiment62_fixture_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment62-fixture-discovery-review
          path: /tmp/experiment62/
          retention-days: 90
          if-no-files-found: warn
