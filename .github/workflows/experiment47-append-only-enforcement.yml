name: Experiment 47 append-only ledger enforcement simulation
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment47_append_only_enforcement.py'
      - '.github/workflows/experiment47-append-only-enforcement.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Test append-only invariants without persistent writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/experiment47_append_only_enforcement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment47-append-only-enforcement-review
          path: /tmp/experiment47/
          retention-days: 30
          if-no-files-found: warn
