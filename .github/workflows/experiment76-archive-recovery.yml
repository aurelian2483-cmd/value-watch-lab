name: Experiment 76 archive-only recovery test
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment76-archive-recovery.yml'
      - 'scripts/experiment76_archive_recovery_test.py'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: false
      - name: Test archive-only recovery and reject corrupted records
        run: python scripts/experiment76_archive_recovery_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment76-recovery-audit
          path: /tmp/experiment76-report.json
          retention-days: 90
          if-no-files-found: warn
