name: Sky fixture container extraction
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/sky_fixture_container_extractor.py'
      - '.github/workflows/sky-fixture-container.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Extract Sky match containers and date headings
        run: python scripts/sky_fixture_container_extractor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-fixture-container-review
          path: /tmp/sky-fixture-container-review.json
          if-no-files-found: warn
