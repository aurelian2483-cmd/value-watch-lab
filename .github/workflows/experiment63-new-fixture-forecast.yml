name: Experiment 63 new fixture paper-only model forecast
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment63-new-fixture-forecast.yml'
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Capture new fixture and freeze a paper-only forecast
        run: python scripts/experiment63_new_fixture_forecast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment63-new-fixture-forecast-review
          path: |
            /tmp/experiment63/
            /tmp/experiment62/
          retention-days: 90
          if-no-files-found: warn
