name: Experiment 50 controlled synthetic ledger append
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment50-controlled-append.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: experiment50-single-synthetic-append
  cancel-in-progress: false
jobs:
  append:
    if: github.ref == 'refs/heads/research/prospective-100'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Guarded synthetic append and remote readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/experiment50_controlled_synthetic_append.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment50-controlled-synthetic-append-review
          path: /tmp/experiment50/
          retention-days: 90
          if-no-files-found: warn
