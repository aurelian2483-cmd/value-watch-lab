name: Sports Watch isolated checks
on:
  push:
    branches:
      - feature/sports-watch-secure-prototype
      - fix/sports-watch-live-data-reliability
      - fix/sports-watch-select-visible-result
      - feature/sports-watch-coverage-handoff
      - feature/sports-watch-live-fixture-picker
      - feature/sports-watch-four-stage-source-switcher
      - fix/sports-watch-ios-cached-placeholder-20261116
      - fix/sports-watch-hidden-placeholder-20261116
      - fix/sports-watch-player-fallback-20261116
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Sports Watch URLs and sports filters
        run: node --test sports-watch/sports-watch.test.cjs
      - name: Validate live fixture parsing and source boundaries
        run: node --test sports-watch/fixtures.test.cjs
      - name: Validate official coverage source trust
        run: node --test sports-watch/coverage.test.cjs
      - name: Probe live fixture provider connectivity and response schema
        continue-on-error: true
        run: node sports-watch/feed-smoke.cjs
      - name: Install repository test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Probe real cross-origin fixture selection in mobile Chromium
        continue-on-error: true
        run: node sports-watch/live-browser-probe.cjs
      - name: Run responsive Chromium browser checks
        run: node sports-watch/browser-qa.cjs
      - name: Check JavaScript syntax
        run: |
          node --check sports-watch/sports-watch.js
          node --check sports-watch/fixtures.js
          node --check sports-watch/coverage.js
      - name: Verify standalone prototype assets
        run: |
          test -s sports-watch/index.html
          test -s sports-watch/sports-watch.css
          test -s sports-watch/sports-watch.js
          test -s sports-watch/fixtures.js
          test -s sports-watch/coverage.js
          grep -q 'href="./sports-watch/"' index.html
          grep -q 'frame-src https://www.youtube-nocookie.com' sports-watch/index.html
