name: Experiment 80 fixture verification audit
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check future fixtures
        run: python scripts/experiment80_fixture_verification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment80-fixture-verification-audit
          path: /tmp/experiment80/verification-report.json
          retention-days: 90
          if-no-files-found: warn
