name: Unified research orchestration
on:
  pull_request:
    paths:
      - 'research/unified-orchestration/**'
      - '.github/workflows/unified-research-orchestration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test orchestration and inherited Phase 2 safeguards
        run: node --test research/unified-orchestration/*.test.mjs research/unified-live/*.test.mjs research/unified-control-centre/*.test.mjs
      - name: Verify exact accepted Phase 2 release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def sha(raw):
              return hashlib.sha256(raw).hexdigest()
          repo = os.environ['GITHUB_REPOSITORY']
          repo_id = int(os.environ['GITHUB_REPOSITORY_ID'])
          endpoint = f'repos/{repo}/actions/artifacts/14975003557'
          a = json.loads(subprocess.check_output(['gh','api',endpoint]))
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/45511111878']))
          head = '79379e17c448f17404d0df70d76b87fcb4f51504'
          expected = '73e81d29abaa688fb20b4958d4a70c153e94e9e7fac498129666847d46d5df4e'
          require(a['id']==14975003557 and a['name']=='unified-research-live-evidence' and a['expired'] is False, 'Artifact identity or expiry')
          w = a['workflow_run']
          require(w['id']==45511111878 and w['head_sha']==head and w['repository_id']==repo_id and w['head_repository_id']==repo_id, 'Artifact provenance mismatch')
          require(run['head_sha']==head and run['conclusion']=='success' and run['status']=='completed', 'Phase 2 workflow not accepted')
          require(a['digest']=='sha256:'+expected and 0<a['size_in_bytes']<=32*1024*1024,'Archive metadata mismatch')
          raw = subprocess.check_output(['gh','api',endpoint+'/zip'])
          require(len(raw)==a['size_in_bytes'] and sha(raw)==expected,'Archive fingerprint mismatch')
          def member(z,name,limit):
              rows=[i for i in z.infolist() if i.filename==name]
              require(len(rows)==1 and not rows[0].is_dir() and 0<rows[0].file_size<=limit,'Invalid archive member: '+name)
              return z.read(rows[0])
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              receipt=json.loads(member(z,'phase2-release-receipt.json',65536))
              preview=member(z,'phase2-local-preview.zip',16*1024*1024)
          require(sha(preview)==receipt['archiveSha256'] and receipt['deterministic'] is True and receipt['tamperRejected'] is True,'Preview receipt mismatch')
          with zipfile.ZipFile(io.BytesIO(preview)) as z:
              manifest=json.loads(member(z,'manifest.json',65536))
              rows=[r for r in manifest['files'] if r['path']=='state/current.json']
              state=member(z,'state/current.json',16*1024*1024)
              require(len(rows)==1 and sha(state)==rows[0]['sha256'] and len(state)==rows[0]['bytes'],'State manifest mismatch')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['orchestration-evidence','orchestration-registry','orchestration-output']:
              (root/name).mkdir()
          (root/'orchestration-evidence/current.json').write_bytes(state)
          (root/'orchestration-output/source-receipt.json').write_text(json.dumps({'artifactId':a['id'],'runId':run['id'],'head':head,'archiveSha256':expected,'previewSha256':sha(preview),'stateBytesSha256':sha(state),'expiresAt':a['expires_at'],'measurementFreshness':'UNKNOWN','modelValidation':'UNVALIDATED','publicationGate':'BLOCKED'},indent=2)+'\n')
          print('PASS exact accepted Phase 2 archive and historical state')
          PY
      - name: Run persistent metadata orchestration against accepted historical state
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {join} from 'node:path'
          import {status} from './research/unified-live/sync.mjs'
          import {inspect,advance} from './research/unified-orchestration/registry.mjs'
          const root=process.env.RUNNER_TEMP,evidence=join(root,'orchestration-evidence'),registry=join(root,'orchestration-registry'),out=join(root,'orchestration-output')
          const before=readFileSync(join(evidence,'current.json')),s=status(evidence)
          const plan={kind:'APPROVED_ORCHESTRATION_REVIEW',schemaVersion:1,baseRevision:'79379e17c448f17404d0df70d76b87fcb4f51504',stateSha256:s.stateSha256,trustSha256:null,mode:'HISTORICAL_MANUAL_REVIEW'}
          const raw=JSON.stringify(plan),path=join(root,'ci-orchestration-plan.json'),fingerprint=createHash('sha256').update(raw).digest('hex')
          writeFileSync(path,raw)
          const args=[evidence,registry,path,fingerprint]
          let view=inspect(...args)
          assert.equal(view.status,'NOT_INITIALIZED')
          for(let i=0;i<7;i++){
            view=advance(...args,view.registrySha256)
            assert.equal(view.reviewed,i+1)
            assert.equal(view.executionAuthorized,false)
            assert.equal(view.publicationGate,'BLOCKED')
            assert.deepEqual(inspect(...args,{trustedRegistrySha256:view.registrySha256}),view)
          }
          assert.equal(view.status,'METADATA_REVIEW_COMPLETE_EXECUTION_BLOCKED')
          assert.deepEqual(readFileSync(join(evidence,'current.json')),before)
          writeFileSync(join(out,'orchestration-status.json'),JSON.stringify(view,null,2)+'\n')
          writeFileSync(join(out,'registry.json'),readFileSync(join(registry,'registry.json')))
          console.log('PASS seven metadata reviews, anchored persistence and unchanged Phase 2 state')
          JS
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-research-orchestration-evidence
          path: ${{ runner.temp }}/orchestration-output/
          retention-days: 7
          if-no-files-found: error
