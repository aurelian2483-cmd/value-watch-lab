name: Experiment 33 Sky Sports schedule source probe
on:
  workflow_dispatch:
  push:
    branches: [research/prospective-100]
    paths:
      - 'scripts/experiment33_sky_source_probe.py'
      - '.github/workflows/experiment33-sky-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-smoke.txt
      - name: Inspect independent Sky Sports schedule
        run: python scripts/experiment33_sky_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment33-sky-schedule-diagnostic
          path: /tmp/experiment33-sky-source.json
          if-no-files-found: warn
          retention-days: 14
