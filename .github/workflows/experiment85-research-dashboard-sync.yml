name: Experiment 93 research dashboard sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/experiment85-research-dashboard-sync.yml']
  schedule:
    - cron: '20 8 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-results-ledger-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-100
          persist-credentials: true
          path: research-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test prospective archive and result tracking
        run: python -m unittest discover -s research-source/tests -p 'test_football_tracking.py'
      - name: Independently cross-check fixture schedule
        run: python research-source/scripts/experiment80_fixture_verification.py
      - name: Generate research-only feed
        run: python research-source/scripts/experiment82_dashboard_feed.py
      - name: Integrate integrity-verified archived paper forecasts
        run: python research-source/scripts/experiment86_archive_feed.py
      - name: Generate experimental football baseline forecasts
        run: python research-source/scripts/experiment102_poisson_research.py
      - name: Freeze pre-kickoff experimental forecasts
        run: python research-source/scripts/experiment106_prospective_archive.py
      - name: Score archived forecasts against two-source final results
        run: python research-source/scripts/experiment90_archive_result_scoring.py
      - name: Append independently checked scores to research ledger
        run: python research-source/scripts/experiment92_results_ledger.py
      - name: Audit per-fixture forecast readiness
        run: python research-source/scripts/experiment101_forecast_readiness.py
      - name: Validate safety and freshness
        run: python research-source/scripts/experiment85_validate_feed.py /tmp/experiment82/dashboard-data.json
      - name: Validate persistent research results for public history
        run: python research-source/scripts/experiment93_public_history.py research-source/research/results-ledger/v1/verified-results.json /tmp/experiment93/history.json
      - name: Persist research archive and verified scores
        shell: bash
        run: |
          set -euo pipefail
          cd research-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/forecast-archive research/results-ledger
          if [ -d research/forecast-revisions ]; then git add -- research/forecast-revisions; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive prospective research forecasts and verified results"
            git pull --rebase origin research/prospective-100
            git push origin HEAD:research/prospective-100
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: experiment85-validated-research-feed
          path: |
            /tmp/experiment82/dashboard-data.json
            /tmp/experiment80/verification-report.json
            /tmp/experiment79/coverage-report.json
            /tmp/experiment106/archive-report.json
            /tmp/experiment90/report.json
            /tmp/experiment93/history.json
            /tmp/experiment80/sky-*.html
          retention-days: 30
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main
          path: website
          persist-credentials: true
      - name: Publish only validated research JSON
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/experiment82/dashboard-data.json website/research-dashboard-data.json
          cp /tmp/experiment93/history.json website/research-history.json
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research-dashboard-data.json research-history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Experiment 85: refresh research-only dashboard snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
