name: Bottleneck second-source private capture (offline)
on:
  push:
    branches:
      - research/bottleneck-future-secondary-capture-20261123
  pull_request:
    branches:
      - research/bottleneck-future-raw-capture-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  second-source-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile private capture and NFL result collectors
        run: |
          python -m py_compile scripts/private_result_capture.py scripts/observe_pending_results.py scripts/collect_secondary_nfl_results.py scripts/export_private_result_manifest.py
      - name: Verify offline original-response retention and existing collectors
        run: |
          python -m unittest discover -s tests -p 'test_private_secondary_capture.py' -v
          python -m unittest discover -s tests -p 'test_private_result_capture.py' -v
          python -m unittest discover -s tests -p 'test_secondary_nfl_results.py' -v
          python -m unittest discover -s tests -p 'test_result_observations.py' -v
          python -m unittest discover -s tests -p 'test_result_reconciliation.py' -v
      - name: Verify no source bytes, observed results, or live output were committed
        run: |
          git diff --exit-code -- prediction-ledger.json results-feed.json research/provider-result-observations.json research/secondary-result-evidence.json research/result-review-status.json
          test ! -d private-result-capture
          echo "Secondary source capture OFF by default; synthetic tests only, no real provider fetch"
