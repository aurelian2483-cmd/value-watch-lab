name: Research dashboard and worksheet checks
on:
  push:
    branches: [main]
    paths: ['racing-research/context*', 'tests/test_racing_context_ui.cjs', 'research-audit-core.js', 'tests/test_research_audit.cjs', 'tests/test_dashboard_refresh.cjs', 'racecards-core.js', 'tests/test_racecards.cjs', 'index.html', 'sportsbook.css', 'track-record/**', 'tests/test_research_track.cjs', 'dashboard-core.js', 'dashboard-data.js', 'tests/test_dashboard_core.cjs', 'racing-research/analysis*', 'racing-research/sources*', 'racing-research/advice*', 'tests/test_horse_advice.cjs', 'racing-research/recommendations*', 'racing-research/source-observations.json', 'tests/test_racing_analysis.cjs', '.github/workflows/racing-analysis-checks.yml']
  pull_request:
    paths: ['racing-research/context*', 'tests/test_racing_context_ui.cjs', 'research-audit-core.js', 'tests/test_research_audit.cjs', 'tests/test_dashboard_refresh.cjs', 'racecards-core.js', 'tests/test_racecards.cjs', 'index.html', 'sportsbook.css', 'track-record/**', 'tests/test_research_track.cjs', 'dashboard-core.js', 'dashboard-data.js', 'tests/test_dashboard_core.cjs', 'racing-research/analysis*', 'racing-research/sources*', 'racing-research/advice*', 'tests/test_horse_advice.cjs', 'racing-research/recommendations*', 'racing-research/source-observations.json', 'tests/test_racing_analysis.cjs', '.github/workflows/racing-analysis-checks.yml']
permissions:
  contents: read
jobs:
  worksheet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and quantitative controls
        run: |
          node --check racing-research/analysis-core.js
          node --check racing-research/analysis.js
          node --check racing-research/sources.js
          node --check racing-research/advice-core.js
          node tests/test_horse_advice.cjs
          node --check racing-research/recommendations.js
          node tests/test_racing_analysis.cjs
          node --check dashboard-core.js
          node --check dashboard-data.js
          node --check racecards-core.js
          node tests/test_racecards.cjs
          node --check racing-research/context.js
          node tests/test_racing_context_ui.cjs
          node --check research-audit-core.js
          node tests/test_research_audit.cjs
          node tests/test_dashboard_refresh.cjs
          node tests/test_dashboard_core.cjs
          node --check track-record/core.js
          node --check track-record/app.js
          node tests/test_research_track.cjs



