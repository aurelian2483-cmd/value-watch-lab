name: Research dashboard and worksheet checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'dashboard-core.js', 'dashboard-data.js', 'tests/test_dashboard_core.cjs', 'racing-research/analysis*', 'racing-research/sources*', 'racing-research/recommendations*', 'racing-research/source-observations.json', 'tests/test_racing_analysis.cjs', '.github/workflows/racing-analysis-checks.yml']
  pull_request:
    paths: ['index.html', 'dashboard-core.js', 'dashboard-data.js', 'tests/test_dashboard_core.cjs', 'racing-research/analysis*', 'racing-research/sources*', 'racing-research/recommendations*', 'racing-research/source-observations.json', 'tests/test_racing_analysis.cjs', '.github/workflows/racing-analysis-checks.yml']
permissions:
  contents: read
jobs:
  worksheet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and quantitative controls
        run: |
          node --check racing-research/analysis-core.js
          node --check racing-research/analysis.js
          node --check racing-research/sources.js
          node --check racing-research/recommendations.js
          node tests/test_racing_analysis.cjs
          node --check dashboard-core.js
          node --check dashboard-data.js
          node tests/test_dashboard_core.cjs
