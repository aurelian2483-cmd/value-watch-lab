name: Experiment 58 retrospective confidence intervals and calibration
on:
  push:
    branches: [research/prospective-100]
    paths:
      - '.github/workflows/experiment58-uncertainty.yml'
permissions:
  contents: read
  actions: read
jobs:
  uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Experiment 57 retrospective predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "experiment57-calibration-review" and .expired == false and .workflow_run.head_branch == "research/prospective-100")] | sort_by(.created_at) | last | .workflow_run.id')
          test -n "$RUN_ID"
          test "$RUN_ID" != "null"
          mkdir -p /tmp/experiment57-downloaded
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name experiment57-calibration-review --dir /tmp/experiment57-downloaded
      - name: Score paired uncertainty and calibration
        run: python scripts/experiment58_uncertainty.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment58-uncertainty-review
          path: /tmp/experiment58/
          retention-days: 90
          if-no-files-found: warn
