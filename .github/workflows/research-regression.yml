name: Full research regression
on:
  push:
    branches: [main, codex/value-watch-development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All browser-independent UI and research controls
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for script in paper-lab/*.js; do node --check "$script"; done
      - name: Historical, collector and model safeguards
        run: python -m unittest discover -s tests
      - name: Provision pinned Value Watch archive
        if: startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags --depth=1 origin 0ab96a96fd66608d931c4109392ee29fe2ba3650
      - name: Provision exact football implementation sources
        if: hashFiles('scripts/football_model_recovery.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: git fetch --no-tags --depth=1 origin 9898e7e7773878ec32a0bfd3c38197fddb566893 a29079994013f159f8a67861d029c6b12f5061e5
      - name: Regenerate pinned provenance and ledger offline
        if: startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/audit_football_provenance.py --check
          python scripts/football_evidence_ledger.py check
          python scripts/football_evidence_intake.py research/football-result-provenance/intake.empty.json
      - name: Generate pinned football shadow report offline
        if: startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch'
        run: python scripts/football_shadow_report.py > /tmp/football-shadow.json
      - name: Repeat ledger regeneration with a different hash seed
        if: startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch'
        env:
          PYTHONHASHSEED: '97'
        run: python scripts/football_evidence_ledger.py check
      - name: Check football model registry and run isolated synthetic formulas
        if: hashFiles('scripts/football_model_recovery.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: python scripts/football_model_recovery.py smoke
      - name: Run recovered football research tests on synthetic fixtures
        if: hashFiles('scripts/football_model_recovery.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: python scripts/football_model_recovery.py archived-tests
      - name: Regenerate date-ordered football replay offline
        if: hashFiles('scripts/football_chronological_replay.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: python scripts/football_chronological_replay.py --check
      - name: Regenerate retrospective score robustness report offline
        if: hashFiles('scripts/football_score_robustness.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: python scripts/football_score_robustness.py --check
      - name: Rehearse offline prospective paper capture and adjudication
        if: hashFiles('tests/football_shadow_capture_rehearsal.py') != '' && (startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch')
        run: python -B tests/football_shadow_capture_rehearsal.py
      - name: Mathematical library and Sky 81 validation
        run: |
          set -euo pipefail
          node research/mathematical-library/validate.mjs
          node --test research/mathematical-library/validate-v1.test.mjs research/mathematical-library/sky81/experiment.test.mjs
          node research/mathematical-library/catalogue.mjs summary > /tmp/sky-catalogue-summary.json
          node research/mathematical-library/catalogue.mjs ledger > /tmp/sky-catalogue-ledger.json
          node research/mathematical-library/sky81/experiment.mjs > /tmp/sky81-configurations.json
          node research/mathematical-library/sky81/reproduce-phase3.mjs research/horse-ab-phase3-master-20261115 > /tmp/sky81-phase3-replay.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const catalogue = JSON.parse(fs.readFileSync('/tmp/sky-catalogue-summary.json', 'utf8'));
          const grid = JSON.parse(fs.readFileSync('/tmp/sky81-configurations.json', 'utf8'));
          const replay = JSON.parse(fs.readFileSync('/tmp/sky81-phase3-replay.json', 'utf8'));
          assert.equal(catalogue.registered, 286);
          assert.equal(catalogue.qualified, 0);
          assert.equal(grid.gridSettings, 100);
          assert.equal(grid.uniqueConfigurations, 81);
          assert.equal(replay.races, 76);
          assert.equal(replay.runnerAppearances, 730);
          assert.equal(replay.gitBlobsVerified, 76);
          assert.equal(replay.archiveRecordsWithNonNullOdds, 0);
          assert.equal(replay.reconstructedTournamentConfigurationsScored, 0);
          console.log('PASS: catalogue preserved; 100 settings canonicalize to 81; 76 archived forecasts replay; no tournament or holdout scoring claimed.');
          EOF

  provenance-portability:
    if: startsWith(github.head_ref, 'codex/phase') || startsWith(github.ref_name, 'codex/phase') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provision pinned Value Watch archive
        run: git fetch --no-tags --depth=1 origin 0ab96a96fd66608d931c4109392ee29fe2ba3650
      - uses: actions/setup-node@v4
        if: hashFiles('scripts/football_model_recovery.py') != ''
        with:
          node-version: '22'
      - name: Provision exact football implementation sources
        if: hashFiles('scripts/football_model_recovery.py') != ''
        run: git fetch --no-tags --depth=1 origin 9898e7e7773878ec32a0bfd3c38197fddb566893 a29079994013f159f8a67861d029c6b12f5061e5
      - name: Football provenance, evaluation and adapter tests
        run: python -m unittest discover -s tests -p "test_football*.py"
      - name: Verified-results pilot tests
        run: python -m unittest discover -s tests -p "test_verified_results_pilot.py"
      - name: Rebuild Phase 10 report offline
        run: python scripts/audit_football_provenance.py --check
      - name: Rebuild evidence ledger and compare offline
        run: python scripts/football_evidence_ledger.py check
      - name: Validate empty fixture receipt intake offline
        run: python scripts/football_evidence_intake.py research/football-result-provenance/intake.empty.json
      - name: Check football model registry and run isolated synthetic formulas
        if: hashFiles('scripts/football_model_recovery.py') != ''
        run: python scripts/football_model_recovery.py smoke
      - name: Run recovered football research tests on synthetic fixtures
        if: hashFiles('scripts/football_model_recovery.py') != ''
        run: python scripts/football_model_recovery.py archived-tests
      - name: Regenerate date-ordered football replay offline
        if: hashFiles('scripts/football_chronological_replay.py') != ''
        run: python scripts/football_chronological_replay.py --check
      - name: Regenerate retrospective score robustness report offline
        if: hashFiles('scripts/football_score_robustness.py') != ''
        run: python scripts/football_score_robustness.py --check
      - name: Rehearse offline prospective paper capture and adjudication
        if: hashFiles('tests/football_shadow_capture_rehearsal.py') != ''
        run: python -B tests/football_shadow_capture_rehearsal.py
