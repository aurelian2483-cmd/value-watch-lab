name: Full research regression
on:
  push:
    branches: [main, codex/value-watch-development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All browser-independent UI and research controls
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for script in paper-lab/*.js; do node --check "$script"; done
      - name: Historical, collector and model safeguards
        run: python -m unittest discover -s tests
      - name: Isolated horse Phase 3 acquisition and locked endpoint regressions
        run: python -m unittest discover -s research/horse-ab-phase3-master-20261115 -p 'test_*.py'
      - name: Reproduce disposable Phase 3 infrastructure audit
        run: |
          set -euo pipefail
          receipt="$(mktemp -d)/phase3-intake-audit.json"
          python scripts/audit_phase3_isolation.py "$receipt"
          cmp "$receipt" research/reviews/phase3-independent-review/intake-audit.json
      - name: Mathematical library and Sky 81 validation
        run: |
          set -euo pipefail
          node research/mathematical-library/validate.mjs
          node --test research/mathematical-library/validate-v1.test.mjs research/mathematical-library/sky81/experiment.test.mjs
          node research/mathematical-library/catalogue.mjs summary > /tmp/sky-catalogue-summary.json
          node research/mathematical-library/catalogue.mjs ledger > /tmp/sky-catalogue-ledger.json
          node research/mathematical-library/sky81/experiment.mjs > /tmp/sky81-configurations.json
          node research/mathematical-library/sky81/reproduce-phase3.mjs research/horse-ab-phase3-master-20261115 > /tmp/sky81-phase3-replay.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const catalogue = JSON.parse(fs.readFileSync('/tmp/sky-catalogue-summary.json', 'utf8'));
          const grid = JSON.parse(fs.readFileSync('/tmp/sky81-configurations.json', 'utf8'));
          const replay = JSON.parse(fs.readFileSync('/tmp/sky81-phase3-replay.json', 'utf8'));
          assert.equal(catalogue.registered, 286);
          assert.equal(catalogue.qualified, 0);
          assert.equal(grid.gridSettings, 100);
          assert.equal(grid.uniqueConfigurations, 81);
          assert.equal(replay.races, 76);
          assert.equal(replay.runnerAppearances, 730);
          assert.equal(replay.gitBlobsVerified, 76);
          assert.equal(replay.archiveRecordsWithNonNullOdds, 0);
          assert.equal(replay.reconstructedTournamentConfigurationsScored, 0);
          console.log('PASS: catalogue preserved; 100 settings canonicalize to 81; 76 archived forecasts replay; no tournament or holdout scoring claimed.');
          EOF
