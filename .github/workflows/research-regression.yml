name: Full research regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All browser-independent UI and research controls
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for script in paper-lab/*.js; do node --check "$script"; done
      - name: Historical, collector and model safeguards
        run: python -m unittest discover -s tests
