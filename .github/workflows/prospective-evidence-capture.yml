name: Prospective source-observed Tennis and NFL archive
on:
  schedule:
    - cron: '35 * * * *'
  # A controlled first collection on merge of this workflow edit; normal data pushes do not retrigger.
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-evidence-capture.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/capture_prospective_research.py'
      - 'tests/test_prospective_capture.py'
      - 'scripts/observe_pending_results.py'
      - 'tests/test_result_observations.py'
      - 'scripts/reconcile_result_evidence.py'
      - 'tests/test_result_reconciliation.py'
      - 'scripts/collect_secondary_nfl_results.py'
      - 'tests/test_secondary_nfl_results.py'
      - '.github/workflows/prospective-evidence-capture.yml'
permissions:
  contents: read
concurrency:
  group: prospective-evidence-capture
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed offline capture and result-observation tests
        run: |
          python -m unittest discover -s tests -p 'test_prospective_capture.py' -v
          python -m unittest discover -s tests -p 'test_result_observations.py' -v
          python -m unittest discover -s tests -p 'test_result_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_secondary_nfl_results.py' -v
  capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current source and append immutable-first records
        run: python scripts/capture_prospective_research.py
      - name: Collect provider-observed finals without independent verification
        run: python scripts/observe_pending_results.py
      - name: Collect strictly unverified separate-provider NFL final observations
        run: python scripts/collect_secondary_nfl_results.py
      - name: Build conservative corroboration review queue
        run: python scripts/reconcile_result_evidence.py
      - name: Validate immutable archive contract and unverified queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('prediction-ledger.json').read_text())
          queue=json.loads(Path('research/pending-independent-results.json').read_text())
          audit=json.loads(Path('research/prospective-capture-audit.json').read_text())
          assert ledger['schemaVersion']==1 and ledger['kind']=='PROSPECTIVE_PREDICTION_LEDGER'
          assert ledger['modelValidated'] is False and isinstance(ledger['records'],list)
          assert queue['research_only'] is True and queue['publication_gate']=='BLOCKED'
          assert all(r['automatic_settlement'] is False for r in queue['pending'])
          assert audit['total_frozen']==len(ledger['records'])
          assert audit['appended']>=0 and audit['eligible']>=audit['appended']
          observations=json.loads(Path('research/provider-result-observations.json').read_text())
          assert observations['research_only'] is True and observations['publication_gate']=='BLOCKED'
          assert all(r['independently_verified'] is False and r['betting_eligible'] is False for r in observations['observations'])
          secondary=json.loads(Path('research/secondary-result-evidence.json').read_text())
          assert secondary['publication_gate']=='BLOCKED' and secondary['research_only'] is True
          assert all(r['independently_verified'] is False and r['betting_eligible'] is False and r['status']=='SECONDARY_UNVERIFIED' for r in secondary['observations'])
          review=json.loads(Path('research/result-review-status.json').read_text())
          assert review['independently_verified_results_added']==0
          assert review['publication_gate']=='BLOCKED'
          assert all(row['auto_certified'] is False and row['betting_eligible'] is False for row in review['items'])
          print('Frozen forecasts:',len(ledger['records']),'New:',audit['appended'],'Pending unverified outcomes:',queue['pending_count'])
          PY
      - name: Persist archive and audit only, never overwrite current forecasts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- prediction-ledger.json research/prospective-capture-audit.json research/pending-independent-results.json research/provider-result-observations.json research/secondary-result-evidence.json research/result-review-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Append prospective Tennis/NFL experimental evidence (no outcome certification)'
            # Rebase conflicts fail closed; never force-push or silently overwrite competing archives.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
